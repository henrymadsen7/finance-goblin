name: Bug report
description: Report a reproducible problem using sample data.
body:
  - type: markdown
    attributes:
      value: "Use sample data. Do not include API keys, bank details, real transactions, vaults, or unredacted logs. For vulnerabilities, see SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Version and environment
      placeholder: Commit or release, macOS version, processor, Node version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional screenshot using generated sample data, or a minimal synthetic example.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real financial data or credentials.
          required: true
